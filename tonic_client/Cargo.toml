[package]
name = "tonic_client"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dependencies]
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json = "1"
tikv-jemallocator = "0.6"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
